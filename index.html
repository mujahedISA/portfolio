<body
  data-crt="soft" data-bg="teal"
  data-scan="on" data-grille="on" data-vig="on" data-glare="on" data-roll="on" data-bloom="on"
  data-flicker="off" data-ca="off"
  data-phos="color" data-power="on" data-ghost="off" data-beep="off">

<a class="skip" href="#desktop">Skip to desktop</a>

<div id="monitorCase">
  <span id="led" aria-hidden="true"></span>
  <button id="powerBtn" type="button" aria-label="Monitor power"></button>

  <div id="screen">
    <div id="stage">
      <div id="wallpaper" aria-hidden="true"></div>
      <div id="wallpaperPrev" aria-hidden="true"></div>

      <main id="desktop" tabindex="-1">
        <h1 class="sr-only">Mujahed Issa — data analyst portfolio, presented as a retro desktop operating system.</h1>
        <div id="icons" role="group" aria-label="Desktop icons"></div>
        <div id="windows"></div>
        <div id="dragghost" aria-hidden="true"></div>
      </main>

      <nav id="startmenu" aria-label="Start menu" hidden>
        <div class="rail" aria-hidden="true"><b>MUJAHED-DOS</b></div>
        <ul id="startlist"></ul>
      </nav>

      <footer id="taskbar">
        <button id="start" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="startmenu"></button>
        <span class="tsep" aria-hidden="true"></span>
        <div id="tasks" aria-label="Open windows"></div>
        <div id="tray">
          <button id="trayMusic" type="button" aria-label="Open media player"></button>
          <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume" />
          <span id="clock" role="timer" aria-label="Clock">--:--</span>
        </div>
      </footer>
    </div>

    <div id="reveal" aria-hidden="true"></div>

    <div class="crt" id="bloomLayer" aria-hidden="true"></div>
    <div class="crt" id="grille" aria-hidden="true"></div>
    <div class="crt" id="scanlines" aria-hidden="true"></div>
    <div class="crt" id="roll" aria-hidden="true"></div>
    <div class="crt" id="glare" aria-hidden="true"></div>
    <div class="crt" id="vignette" aria-hidden="true"></div>

    <pre id="boot" role="status" aria-label="System boot log"></pre>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<p id="live" class="sr-only" role="status" aria-live="polite"></p>
